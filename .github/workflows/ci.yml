name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-and-test:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      # config.ts valida o segredo no import; os testes não usam banco real.
      JWT_SECRET: test-only-secret-with-at-least-32-characters-123456
      DB_PASSWORD: test-only-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Typecheck (api, web, realtime, worker)
        run: npm run typecheck

      - name: Testes (api e realtime)
        run: npm test

  schema-migration:
    name: Schema, backfill e escrita canônica (M1/M2/M3)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: c4arch
          POSTGRES_PASSWORD: c4arch
          POSTGRES_DB: c4arch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c4arch -d c4arch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      JWT_SECRET: test-only-secret-with-at-least-32-characters-123456
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: c4arch
      DB_USER: c4arch
      DB_PASSWORD: c4arch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Build da API
        run: npm run build --workspace=@c4arch/api

      - name: Testar schema canônico e idempotência
        run: npm run test:schema --workspace=@c4arch/api
        env:
          RUN_SCHEMA_TESTS: "true"

      - name: Testar backfill e leitura em sombra (M2)
        run: npm run test:m2 --workspace=@c4arch/api
        env:
          RUN_M2_TESTS: "true"

      - name: Testar estado durável, projetor, DAS e restore (M3)
        run: npm run test:m3 --workspace=@c4arch/api
        env:
          RUN_M3_TESTS: "true"
