apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c4arch.fullname" . }}-worker
  labels:
    {{- include "c4arch.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "c4arch.name" . }}-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "c4arch.name" . }}-worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}-worker:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "c4arch.fullname" . }}-config
            - secretRef:
                name: {{ include "c4arch.fullname" . }}-secret