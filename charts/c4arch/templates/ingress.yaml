{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "c4arch.fullname" . }}
  labels:
    {{- include "c4arch.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "c4arch.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "c4arch.fullname" . }}-realtime
                port:
                  number: {{ .Values.realtime.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "c4arch.fullname" . }}-web
                port:
                  number: 80
{{- end }}