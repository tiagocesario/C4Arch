apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c4arch.fullname" . }}-realtime
  labels:
    {{- include "c4arch.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "c4arch.name" . }}-realtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "c4arch.name" . }}-realtime
    spec:
      containers:
        - name: realtime
          image: "{{ .Values.image.repository }}-realtime:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.realtime.port }}
          envFrom:
            - configMapRef:
                name: {{ include "c4arch.fullname" . }}-config
            - secretRef:
                name: {{ include "c4arch.fullname" . }}-secret
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c4arch.fullname" . }}-realtime
  labels:
    {{- include "c4arch.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "c4arch.name" . }}-realtime
  ports:
    - port: {{ .Values.realtime.port }}
      targetPort: {{ .Values.realtime.port }}