apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c4arch.fullname" . }}-api
  labels:
    {{- include "c4arch.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "c4arch.name" . }}-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "c4arch.name" . }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}-api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "c4arch.fullname" . }}-config
            - secretRef:
                name: {{ include "c4arch.fullname" . }}-secret
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c4arch.fullname" . }}-api
  labels:
    {{- include "c4arch.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "c4arch.name" . }}-api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}