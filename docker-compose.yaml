# C4Arch — Compose local de desenvolvimento.
# Levanta: postgres, api, web, realtime, worker.
#
# Execute:
#   docker compose up -d --build
#   docker compose logs -f          # acompanhar tudo
#   docker compose down             # parar
#
# Segurança: portas publicadas apenas em 127.0.0.1 por padrão. Defina
# BIND_ADDR=0.0.0.0 somente quando souber que a exposição é intencional.

name: c4arch

services:
  # Named volumes são criados como root. Ajusta a ownership para o usuário
  # `node` (uid 1000) antes de realtime/worker iniciarem.
  storage-init:
    image: alpine:3.20
    restart: "no"
    security_opt:
      - no-new-privileges:true
    command: ["sh", "-c", "chown -R 1000:1000 /app/storage && chmod 0750 /app/storage"]
    volumes:
      - c4arch_storage:/app/storage

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - PORT=${PORT:-4000}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - SEED_DEMO=${SEED_DEMO:-true}
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD:-admin123}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-drive}
      - DRIVE_FOLDER_ID=${DRIVE_FOLDER_ID}
      - DRIVE_CLIENT_ID=${DRIVE_CLIENT_ID}
      - DRIVE_CLIENT_SECRET=${DRIVE_CLIENT_SECRET}
      - GLAB_PROJECT_ID=${GLAB_PROJECT_ID}
      - GLAB_TOKEN=${GLAB_TOKEN}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      # URLs usadas pelo NAVEGADOR (não pelo container). Em dev, os serviços
      # são expostos em localhost; em produção, configure PUBLIC_* no .env.
      args:
        VITE_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:4001}
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  realtime:
    build:
      context: ./apps/realtime
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WS_PORT:-4001}:4001"
    environment:
      - WS_PORT=${WS_PORT:-4001}
      - API_URL=http://api:4000
      - API_TOKEN=${API_TOKEN_REALTIME:-}
      - WS_ALLOW_ANONYMOUS=${WS_ALLOW_ANONYMOUS:-false}
    volumes:
      - c4arch_storage:/app/storage
    depends_on:
      api:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-drive}
      - DRIVE_FOLDER_ID=${DRIVE_FOLDER_ID}
      - GLAB_PROJECT_ID=${GLAB_PROJECT_ID}
      - GLAB_TOKEN=${GLAB_TOKEN}
      - STORAGE_DIR=/app/storage
    volumes:
      - c4arch_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  c4arch_storage:

networks:
  default:
    name: c4arch-network
